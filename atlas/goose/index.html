<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Cyber Goose: Block World</title>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--glow:#19d3ff;--ink:#0b1020}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#0b1020;font-family:Nunito,system-ui,-apple-system,sans-serif;font-weight:700;color:#fff;
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font:inherit;color:inherit;cursor:pointer;border:0}
.hidden{display:none!important}

/* ---------- menu ---------- */
#menu{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:14px 14px 18px;pointer-events:none}
#title{text-align:center;transform:rotate(-4deg);margin-top:6px}
#title h1{font-family:Bangers,Impact,sans-serif;font-weight:400;font-size:clamp(46px,13vw,104px);line-height:.86;margin:0;letter-spacing:2px;
  color:#fff;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 0 18px var(--glow),5px 6px 0 var(--ink)}
#title .sub{font-family:Bangers,Impact,sans-serif;font-size:clamp(18px,5vw,34px);letter-spacing:3px;color:var(--glow);text-shadow:2px 2px 0 var(--ink)}
#menuBottom{width:100%;max-width:760px;pointer-events:auto}
#pick{text-align:center;font-size:14px;letter-spacing:2px;text-transform:uppercase;margin-bottom:8px;text-shadow:0 2px 0 var(--ink)}
#cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.card{background:rgba(11,16,32,.86);border:3px solid var(--glow);border-radius:16px;padding:12px 8px;text-align:center;
  box-shadow:0 0 16px -2px var(--glow),0 5px 0 var(--ink);transition:transform .08s}
.card:active{transform:translateY(3px) scale(.98)}
.card .ic{font-size:30px;line-height:1.1}
.card .nm{font-family:Bangers,Impact,sans-serif;font-size:22px;letter-spacing:1.5px;margin-top:2px}
.card .ds{font-size:11.5px;opacity:.85;line-height:1.25;margin-top:2px}
#credit{text-align:center;font-size:11px;opacity:.8;margin-top:10px;letter-spacing:1px;text-shadow:0 1px 0 var(--ink)}
@media (max-width:520px){#cards{grid-template-columns:1fr;gap:8px}.card{display:flex;align-items:center;gap:12px;text-align:left;padding:9px 14px}.card .ic{font-size:28px}.card .nm{margin:0}}

/* ---------- hud ---------- */
#hud{position:fixed;left:0;right:0;top:0;display:flex;align-items:flex-start;gap:8px;padding:10px;pointer-events:none}
.pill{pointer-events:auto;background:rgba(11,16,32,.82);border:2px solid var(--glow);border-radius:12px;padding:8px 12px;font-size:13px;letter-spacing:1px;
  box-shadow:0 0 10px -3px var(--glow)}
#info{flex:1;text-align:center;font-size:14px;min-height:38px;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
#info b{color:var(--glow)}
#hud button{white-space:nowrap}
@media (max-width:560px){#hud{gap:5px;padding:8px 6px}.pill{padding:7px 8px;font-size:11px;letter-spacing:.5px}#info{font-size:11.5px;gap:4px;padding:6px}.bar{width:44px}#bLab .lg{display:none}#bMenu .lg{display:none}}
.bar{display:inline-block;width:70px;height:10px;border-radius:6px;background:#26304d;overflow:hidden;vertical-align:middle}
.bar i{display:block;height:100%;background:var(--glow)}
#toast{position:fixed;left:50%;top:22%;transform:translateX(-50%);background:rgba(11,16,32,.88);border:2px solid var(--glow);border-radius:14px;
  padding:10px 18px;font-size:16px;text-align:center;opacity:0;transition:opacity .2s;pointer-events:none;max-width:86vw}
#banner{position:fixed;left:0;right:0;top:30%;text-align:center;font-family:Bangers,Impact,sans-serif;font-size:clamp(54px,16vw,130px);letter-spacing:4px;
  color:#fff;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 0 24px var(--glow),6px 7px 0 var(--ink);
  opacity:0;transform:scale(.6) rotate(-4deg);transition:opacity .15s,transform .25s cubic-bezier(.2,1.6,.4,1);pointer-events:none}
#banner.on{opacity:1;transform:scale(1) rotate(-4deg)}
#bubble{position:fixed;font-family:Bangers,Impact,sans-serif;font-size:30px;letter-spacing:2px;color:var(--ink);background:#fff;border:3px solid var(--ink);
  border-radius:16px;padding:2px 12px;transform:translate(-50%,-120%) rotate(-6deg);opacity:0;transition:opacity .12s;pointer-events:none;white-space:nowrap}
#hint{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);font-size:12px;letter-spacing:1px;background:rgba(11,16,32,.7);padding:6px 12px;border-radius:10px;pointer-events:none;white-space:nowrap}
kbd{background:#fff;color:var(--ink);border-radius:5px;padding:1px 6px;font:inherit;font-size:11px}

/* ---------- touch ---------- */
#touch{position:fixed;inset:0;pointer-events:none}
#joy{position:absolute;left:18px;bottom:22px;width:132px;height:132px;border-radius:50%;background:rgba(11,16,32,.45);border:3px solid rgba(255,255,255,.55);pointer-events:auto}
#knob{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:var(--glow);box-shadow:0 0 14px var(--glow);border:3px solid #fff}
.tb{position:absolute;border-radius:50%;pointer-events:auto;font-family:Bangers,Impact,sans-serif;letter-spacing:1px;color:#fff;
  background:rgba(11,16,32,.6);border:3px solid var(--glow);box-shadow:0 0 12px -2px var(--glow);display:flex;align-items:center;justify-content:center}
.tb.down{background:var(--glow);color:var(--ink);transform:scale(.94)}
#btnA{right:18px;bottom:26px;width:92px;height:92px;font-size:22px}
#btnB{right:118px;bottom:18px;width:70px;height:70px;font-size:16px}
#btnH{right:26px;bottom:128px;width:70px;height:70px;font-size:17px;border-color:#ffb020;box-shadow:0 0 12px -2px #ffb020}

/* ---------- code lab ---------- */
#lab{position:fixed;right:8px;top:58px;width:min(330px,calc(100vw - 16px));max-height:calc(100vh - 70px);overflow:auto;background:rgba(8,12,26,.95);
  border:2px solid var(--glow);border-radius:14px;padding:12px 14px;box-shadow:0 0 18px -4px var(--glow);touch-action:pan-y}
#lab h3{margin:0 0 2px;font-family:Bangers,Impact,sans-serif;font-weight:400;font-size:24px;letter-spacing:2px;color:var(--glow)}
#lab p{margin:0 0 10px;font-size:12px;opacity:.85;font-weight:700}
.row{margin-bottom:9px}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;font-weight:400}
.code .k{color:#ff7ad9}.code .n{color:#ffd166}.code .c{color:#7d8bb0}
input[type=range]{width:100%;accent-color:var(--glow);height:26px;margin:0;touch-action:pan-x}
#swatches{display:flex;gap:8px;margin:4px 0 10px}
#swatches button{width:30px;height:30px;border-radius:50%;border:3px solid #fff}
#presets{display:flex;flex-wrap:wrap;gap:6px}
#presets button{background:#18223f;border:2px solid var(--glow);border-radius:10px;padding:6px 10px;font-size:12px}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="menu">
  <div id="title"><h1>CYBER<br>GOOSE</h1><div class="sub">BLOCK WORLD</div></div>
  <div id="menuBottom">
    <div id="pick">Pick a world · tap the goose to honk</div>
    <div id="cards">
      <button class="card" data-s="park"><div class="ic">👑</div><div><div class="nm">GOOSE PARK</div><div class="ds">Jump, double-jump, grab coins, lead goslings, climb to the crown</div></div></button>
      <button class="card" data-s="bike"><div class="ic">⚡</div><div><div class="nm">VOLT VALLEY</div><div class="ds">Ride the electric dirt bike. Hit ramps, boost, spin, race the gates</div></div></button>
      <button class="card" data-s="hockey"><div class="ic">🏒</div><div><div class="nm">POND HOCKEY</div><div class="ds">Skate, steal, shoot. First to 5 goals beats Robo-Goose</div></div></button>
    </div>
    <div id="credit">AN ATLASPHERIC INDUSTRIES PRODUCTION · BUILT FROM A BLANK FILE</div>
  </div>
</div>

<div id="hud" class="hidden">
  <button class="pill" id="bMenu">◀ <span class="lg">MENU</span></button>
  <div class="pill" id="info"></div>
  <button class="pill" id="bLab">{ } <span class="lg">CODE </span>LAB</button>
  <button class="pill" id="bSnd">♪</button>
</div>
<div id="toast"></div>
<div id="banner"></div>
<div id="bubble">HONK!</div>
<div id="hint" class="hidden"></div>

<div id="touch" class="hidden">
  <div id="joy"><div id="knob"></div></div>
  <button class="tb" id="btnH">HONK</button>
  <button class="tb" id="btnB">RUN</button>
  <button class="tb" id="btnA">JUMP</button>
</div>

<div id="lab" class="hidden">
  <h3>CODE LAB</h3>
  <p>These are real variables from the game code. Change a number. Watch the world change.</p>
  <div id="rows"></div>
  <div class="code"><span class="k">let</span> glow = <span class="n" id="glowVal">"#19d3ff"</span>;</div>
  <div id="swatches"></div>
  <div id="presets">
    <button data-p="moon">Moon mode</button><button data-p="giant">Giant goose</button><button data-p="tiny">Tiny goose</button><button data-p="turbo">Turbo</button><button data-p="reset">Reset</button>
  </div>
</div>

<script src="three.min.js"></script>
<script>
(() => {
'use strict';
if(!window.THREE){ document.getElementById('pick').textContent='The 3D library did not load. Check the connection and reload.'; return; }
const T = THREE;
const $ = id => document.getElementById(id);
const clamp = (v,a,b) => v<a?a:v>b?b:v;
const rand = (a,b) => a + Math.random()*(b-a);
const TAU = Math.PI*2;
function lerpAngle(a,b,k){ const d=((b-a+Math.PI)%TAU+TAU)%TAU-Math.PI; return a+d*Math.min(1,k); }
function seeded(s){ return () => { s|=0; s=s+0x6D2B79F5|0; let t=Math.imul(s^s>>>15,1|s); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

/* =====================  THE HACKABLE VARIABLES  ===================== */
const DEFAULTS = { gravity:26, speed:9, jump:11, size:1, bikePower:30, puck:26, glow:'#19d3ff' };
const V = Object.assign({}, DEFAULTS);
const LAB = [
  ['gravity','gravity',4,60,1,'how hard the world pulls down'],
  ['speed','speed',3,22,0.5,'how fast the goose moves'],
  ['jump','jumpPower',5,28,0.5,'how high the goose jumps'],
  ['size','gooseSize',0.4,3,0.1,'1 is normal, 3 is GIANT'],
  ['bikePower','bikePower',10,90,1,'electric motor strength'],
  ['puck','shotPower',10,55,1,'how hard the goose shoots'],
];

/* =====================  RENDERER  ===================== */
const canvas = $('c');
const renderer = new T.WebGLRenderer({canvas, antialias:true, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = T.PCFSoftShadowMap;
const scene = new T.Scene();
scene.background = new T.Color('#6ec6ff');
scene.fog = new T.Fog('#6ec6ff', 80, 260);
const camera = new T.PerspectiveCamera(60, 1, 0.1, 600);
const hemi = new T.HemisphereLight(0xffffff, 0xc8d4ee, 2.3); scene.add(hemi);
const sun = new T.DirectionalLight(0xffffff, 2.2);
sun.castShadow = true; sun.shadow.mapSize.set(1024,1024);
{ const s=sun.shadow.camera; s.left=-38; s.right=38; s.top=38; s.bottom=-38; s.near=1; s.far=140; }
scene.add(sun); scene.add(sun.target);
const focus = new T.Vector3();
function resize(){ const w=window.innerWidth, h=window.innerHeight; renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix(); }
window.addEventListener('resize', resize); resize();

/* =====================  BLOCK HELPERS  ===================== */
const GEO = new T.BoxGeometry(1,1,1);
const GLOW = 'GLOW';
const mats = {};
const glowMat = new T.MeshBasicMaterial({color:V.glow});
const dimMat  = new T.MeshLambertMaterial({color:'#2a3555'});
function mat(c){ if(c===GLOW) return glowMat; if(c && c.isMaterial) return c; return mats[c] || (mats[c] = new T.MeshLambertMaterial({color:c})); }
function box(w,h,d,c,x,y,z,parent,shadow){
  const m = new T.Mesh(GEO, mat(c)); m.scale.set(w,h,d); m.position.set(x||0,y||0,z||0);
  m.castShadow = shadow!==false; m.receiveShadow = true; if(parent) parent.add(m); return m;
}
let world = new T.Group(); scene.add(world);

/* =====================  CYBER GOOSE  ===================== */
function makeGoose(p){
  p = p||{};
  const body=p.body||'#ffffff', hood=p.hood||'#14161c', beak=p.beak||'#ff9a1f', gm=p.glow||GLOW;
  const root=new T.Group(), m=new T.Group(); root.add(m);
  const G={root, model:m, honkT:0};
  G.legs=[-1,1].map(s=>{ const g=new T.Group(); g.position.set(s*0.25,0.7,0);
    box(0.18,0.7,0.18,beak,0,-0.35,0,g); box(0.36,0.12,0.56,beak,0,-0.64,0.14,g); m.add(g); return g; });
  box(0.95,0.8,1.25,body,0,1.1,0,m);
  box(0.5,0.3,0.3,body,0,1.35,-0.72,m);
  if(!p.plain){
    box(1.02,0.62,0.95,hood,0,1.22,0.12,m);
    box(1.04,0.08,0.97,gm,0,0.95,0.12,m);
    box(0.3,0.3,0.04,gm,0,1.25,0.61,m);
    box(0.5,0.2,0.5,hood,0,1.6,0.3,m);
  }
  G.wings=[-1,1].map(s=>{ const g=new T.Group(); g.position.set(s*0.6,1.5,0.15);
    box(0.24,0.6,0.42,p.plain?body:hood,0,-0.3,0,g);
    if(!p.plain) box(0.26,0.08,0.44,gm,0,-0.5,0,g);
    box(0.22,0.3,0.4,body,0,-0.74,0,g); m.add(g); return g; });
  box(0.32,0.75,0.32,body,0,1.95,0.4,m);
  const h=new T.Group(); h.position.set(0,2.45,0.45); m.add(h); G.head=h;
  box(0.52,0.46,0.58,body,0,0,0,h);
  box(0.3,0.14,0.42,beak,0,-0.08,0.48,h);
  if(p.plain){ box(0.08,0.08,0.02,'#111',-0.14,0.08,0.3,h,false); box(0.08,0.08,0.02,'#111',0.14,0.08,0.3,h,false); }
  else {
    box(0.58,0.16,0.1,gm,0,0.06,0.3,h);
    for(let i=0;i<3;i++) box(0.6,0.02,0.11,'#0a0a0f',0,0.02+i*0.045,0.3,h,false);
    box(0.62,0.08,0.14,hood,0,0.27,-0.02,h);
    [-1,1].forEach(s=>{ box(0.12,0.34,0.34,hood,s*0.32,0.02,-0.02,h); box(0.03,0.2,0.2,gm,s*0.39,0.02,-0.02,h); });
  }
  // crown (earned in Goose Park)
  const cr=new T.Group(); cr.position.set(0,0.42,0); cr.visible=false; h.add(cr); G.crown=cr;
  box(0.46,0.1,0.46,'#ffd21f',0,0,0,cr);
  [[-.18,-.18],[.18,-.18],[-.18,.18],[.18,.18],[0,.2],[0,-.2]].forEach(a=>box(0.1,0.2,0.1,'#ffd21f',a[0],0.13,a[1],cr));
  // hockey stick
  const st=new T.Group(); st.position.set(-0.78,1.0,0.3); st.visible=false; m.add(st); G.stick=st;
  const shaft=box(0.08,1.7,0.08,'#b9814a',0,-0.35,0.42,st); shaft.rotation.x=-0.55;
  box(0.1,0.16,0.62,'#1a1a1f',0,-0.9,1.05,st);
  return G;
}
function animGoose(G,t,move,air){
  const sw=Math.sin(t*11)*0.9*move;
  G.legs[0].rotation.x=sw; G.legs[1].rotation.x=-sw;
  if(air){ const f=1.15+Math.sin(t*32)*0.55; G.wings[0].rotation.z=-f; G.wings[1].rotation.z=f; G.wings[0].rotation.x=G.wings[1].rotation.x=0; }
  else { G.wings[0].rotation.z=-0.08; G.wings[1].rotation.z=0.08; G.wings[0].rotation.x=-sw*0.6; G.wings[1].rotation.x=sw*0.6; }
  G.head.position.y=2.45+Math.sin(t*(move>0.1?11:3))*0.035;
  G.model.position.y=Math.abs(Math.sin(t*11))*0.08*move;
}
const hero = makeGoose();
let hasCrown = false;
function heroReset(){
  scene.add(hero.root);
  hero.root.position.set(0,0,0); hero.root.rotation.set(0,0,0); hero.root.scale.setScalar(V.size);
  hero.model.rotation.set(0,0,0); hero.model.position.set(0,0,0);
  hero.legs.forEach(l=>l.rotation.set(0,0,0)); hero.wings.forEach(w=>w.rotation.set(0,0,0));
  hero.stick.visible=false; hero.stick.rotation.set(0,0,0); hero.crown.visible=hasCrown;
}

/* =====================  PARTICLES + RINGS  ===================== */
const parts=[];
function burst(x,y,z,color,n,sp){
  n=n||12; sp=sp||6;
  for(let i=0;i<n && parts.length<260;i++){
    const m=box(0.2,0.2,0.2,color,x,y,z,scene,false);
    m.userData={vx:rand(-sp,sp),vy:rand(sp*0.3,sp*1.2),vz:rand(-sp,sp),life:rand(0.6,1.2)};
    parts.push(m);
  }
}
function confetti(x,y,z){ ['#ff4d6d','#ffd21f','#19d3ff','#7CFC6B','#c77dff','#ffffff'].forEach(c=>burst(x,y,z,c,9,9)); }
function updateParts(dt){
  for(let i=parts.length-1;i>=0;i--){ const m=parts[i], u=m.userData;
    u.vy-=22*dt; m.position.x+=u.vx*dt; m.position.y+=u.vy*dt; m.position.z+=u.vz*dt;
    m.rotation.x+=dt*7; m.rotation.y+=dt*5; u.life-=dt; m.scale.setScalar(Math.max(0.01,u.life*0.25));
    if(u.life<=0||m.position.y<-2){ scene.remove(m); parts.splice(i,1); } }
}
const rings=[]; const ringGeo=new T.TorusGeometry(1,0.07,6,30);
function ring(x,y,z){ const m=new T.Mesh(ringGeo,new T.MeshBasicMaterial({color:glowMat.color.getHex(),transparent:true}));
  m.rotation.x=Math.PI/2; m.position.set(x,y,z); m.userData.t=0; scene.add(m); rings.push(m); }
function updateRings(dt){ for(let i=rings.length-1;i>=0;i--){ const m=rings[i]; m.userData.t+=dt; const k=m.userData.t/0.6;
  m.scale.setScalar(1+k*9); m.material.opacity=1-k; if(k>=1){ scene.remove(m); m.material.dispose(); rings.splice(i,1);} } }

/* =====================  SOUND (made in code)  ===================== */
let AC=null, master=null, muted=false, motor=null;
function initAudio(){ if(AC){ if(AC.state==='suspended') AC.resume().catch(()=>{}); return; }
  try{ AC=new (window.AudioContext||window.webkitAudioContext)(); master=AC.createGain(); master.gain.value=0.5; master.connect(AC.destination); }catch(e){ AC=null; } }
function tone(freq,dur,type,vol,slide,delay){
  if(!AC||muted) return;
  try{ const t0=AC.currentTime+(delay||0), o=AC.createOscillator(), g=AC.createGain();
    o.type=type||'sine'; o.frequency.setValueAtTime(freq,t0);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,freq+slide),t0+dur);
    g.gain.setValueAtTime(vol||0.2,t0); g.gain.exponentialRampToValueAtTime(0.001,t0+dur);
    o.connect(g); g.connect(master); o.start(t0); o.stop(t0+dur+0.03); }catch(e){}
}
const sfx={
  coin(){tone(880,.08,'square',.1);tone(1320,.16,'square',.1,0,.07);},
  jump(){tone(300,.18,'sine',.22,320);}, flap(){tone(520,.12,'triangle',.2,420);},
  honk(){tone(330,.15,'sawtooth',.2,-50);tone(285,.3,'sawtooth',.2,-90,.14);},
  land(){tone(130,.12,'sine',.28,-70);}, boing(){tone(190,.32,'sine',.28,640);},
  gate(){tone(660,.1,'triangle',.2);tone(990,.2,'triangle',.2,0,.08);},
  horn(){tone(185,.95,'square',.13);tone(233,.95,'square',.1);},
  shot(){tone(170,.09,'square',.25,-90);}, tick(){tone(720,.03,'square',.07);},
  win(){[523,659,784,1046].forEach((f,i)=>tone(f,.22,'triangle',.22,0,i*.12));},
  peep(){tone(1400,.09,'sine',.16,320);tone(1700,.09,'sine',.16,200,.1);},
  thud(){tone(95,.16,'sine',.32,-45);}, boost(){tone(210,.4,'sawtooth',.08,720);}, dash(){tone(420,.16,'triangle',.16,-220);}
};
function motorOn(){ if(!AC||motor) return; try{ const o=AC.createOscillator(), f=AC.createBiquadFilter(), g=AC.createGain();
  o.type='sawtooth'; f.type='lowpass'; f.frequency.value=520; g.gain.value=0; o.connect(f); f.connect(g); g.connect(master); o.start(); motor={o,g}; }catch(e){} }
function motorOff(){ if(motor){ try{motor.o.stop();}catch(e){} motor=null; } }

/* =====================  UI HELPERS  ===================== */

// joystick
{ const joy=$('joy'), knob=$('knob'); let id=null;
  const set=e=>{ const r=joy.getBoundingClientRect(); let dx=e.clientX-(r.left+r.width/2), dy=e.clientY-(r.top+r.height/2);
    const L=Math.hypot(dx,dy), M=48; if(L>M){ dx*=M/L; dy*=M/L; }
    knob.style.transform='translate('+dx+'px,'+dy+'px)'; tch.x=dx/M; tch.y=-dy/M; if(Math.hypot(tch.x,tch.y)<0.15){tch.x=0;tch.y=0;} };
  joy.addEventListener('pointerdown',e=>{ id=e.pointerId; try{joy.setPointerCapture(id);}catch(_){} set(e); e.preventDefault(); });
  joy.addEventListener('pointermove',e=>{ if(e.pointerId===id) set(e); });
  const end=e=>{ if(e.pointerId===id){ id=null; tch.x=tch.y=0; knob.style.transform=''; } };
  joy.addEventListener('pointerup',end); joy.addEventListener('pointercancel',end);
}
function holdBtn(el,down,up){
  el.addEventListener('pointerdown',e=>{ e.preventDefault(); try{el.setPointerCapture(e.pointerId);}catch(_){} el.classList.add('down'); down(); });
  const u=()=>{ el.classList.remove('down'); if(up) up(); };
  el.addEventListener('pointerup',u); el.addEventListener('pointercancel',u);
}

const camPos=new T.Vector3(), camLook=new T.Vector3(), camLookT=new T.Vector3(); let camSnap=true;
function setCam(px,py,pz,lx,ly,lz,dt,rate){
  const k=camSnap?1:1-Math.exp(-dt*(rate||6));
  camPos.set(px,py,pz); camera.position.lerp(camPos,k);
  camLookT.set(lx,ly,lz); camLook.lerp(camLookT,camSnap?1:1-Math.exp(-dt*10)); camera.lookAt(camLook); camSnap=false;
}

function cloud(g,x,y,z,s){ s=s||1; box(9*s,1.8*s,4.5*s,'#ffffff',x,y,z,g,false); box(5.5*s,1.8*s,3.4*s,'#ffffff',x+2*s,y+1.4*s,z+0.5,g,false); }
function island(g,x,y,z,s){ s=s||1;
  box(16*s,2*s,16*s,'#4fbf4a',x,y,z,g,false); box(12*s,3*s,12*s,'#8a5a2b',x,y-2.5*s,z,g,false); box(7*s,3*s,7*s,'#6d4521',x,y-5.5*s,z,g,false);
  box(7*s,6*s,7*s,'#7f8aa3',x,y+4*s,z,g,false);
  [[-4,-4],[4,-4],[-4,4],[4,4]].forEach(a=>{ box(2.6*s,9*s,2.6*s,'#939fba',x+a[0]*s,y+5.5*s,z+a[1]*s,g,false); box(3.2*s,1*s,3.2*s,'#c0392b',x+a[0]*s,y+10.5*s,z+a[1]*s,g,false); });
  box(1.2*s,14*s,0.4*s,GLOW,x+3*s,y-6*s,z+8.1*s,g,false);
  box(2*s,2*s,0.2*s,GLOW,x,y+6*s,z+3.55*s,g,false); }
function sky(g,rng){ for(let i=0;i<14;i++){ const a=rng()*TAU, r=60+rng()*120; cloud(g,Math.cos(a)*r,34+rng()*26,Math.sin(a)*r,0.8+rng()); } }
function patches(g,rng,n,range,colors,y){
  const im=new T.InstancedMesh(GEO,new T.MeshLambertMaterial({color:'#ffffff'}),n), o=new T.Object3D(), c=new T.Color();
  for(let i=0;i<n;i++){ o.position.set((rng()-0.5)*range,y,(rng()-0.5)*range); o.scale.set(1.5+rng()*5,0.04,1.5+rng()*5); o.rotation.y=0; o.updateMatrix();
    im.setMatrixAt(i,o.matrix); im.setColorAt(i,c.set(colors[(rng()*colors.length)|0])); }
  im.receiveShadow=true; g.add(im); return im;
}

  update(dt,t){
    const S=this, P=S.p, R=0.45*V.size, H=2.9*V.size;
    camYaw-=inp.x*1.5*dt;
    const fx=Math.sin(camYaw), fz=Math.cos(camYaw), rx=-fz, rz=fx;
    let mx=fx*inp.y+rx*inp.x, mz=fz*inp.y+rz*inp.x; const ml=Math.hypot(mx,mz); if(ml>1){mx/=ml;mz/=ml;}
    const sp=V.speed*(inp.b?1.6:1), k=Math.min(1,dt*(P.ground?11:4));
    P.vx+=(mx*sp-P.vx)*k; P.vz+=(mz*sp-P.vz)*k;
    if(ml>0.1) P.h=lerpAngle(P.h,Math.atan2(mx,mz),dt*12);
    if(inp.aP){
      if(P.ground||P.coyote>0){ P.vy=V.jump; P.ground=false; P.coyote=0; P.jumps=1; sfx.jump(); }
      else if(P.jumps<2){ P.vy=V.jump*0.92; P.jumps=2; sfx.flap(); burst(P.x,P.y+1.2,P.z,'#ffffff',8,4); }
    }
    P.vy-=V.gravity*dt;
    let nx=P.x+P.vx*dt, nz=P.z+P.vz*dt;
    for(const s of S.solids){
      if(nx>s.x0-R&&nx<s.x1+R&&nz>s.z0-R&&nz<s.z1+R&&P.y<s.y1-0.35&&P.y+H>s.y0){
        const a=nx-(s.x0-R), b=(s.x1+R)-nx, c=nz-(s.z0-R), d=(s.z1+R)-nz, m=Math.min(a,b,c,d);
        if(m===a){nx=s.x0-R;P.vx=0;} else if(m===b){nx=s.x1+R;P.vx=0;} else if(m===c){nz=s.z0-R;P.vz=0;} else {nz=s.z1+R;P.vz=0;}
      }
    }
    nx=clamp(nx,-80,80); nz=clamp(nz,-80,80);
    let ny=P.y+P.vy*dt;
    if(P.vy>0) for(const s of S.solids){ if(nx>s.x0-R&&nx<s.x1+R&&nz>s.z0-R&&nz<s.z1+R&&P.y+H<=s.y0+0.02&&ny+H>s.y0){ ny=s.y0-H; P.vy=0; } }
    const gy=S.groundAt(nx,nz,P.y,R*0.7);
    if(ny<=gy){ if(!P.ground&&P.vy<-9){ sfx.land(); burst(nx,gy+0.2,nz,'#dfe7ee',6,3); } ny=gy; P.vy=0; P.ground=true; P.jumps=0; P.coyote=0.12; }
    else { P.ground=false; P.coyote-=dt; }
    P.x=nx; P.y=ny; P.z=nz;
    for(const pd of S.pads){ if(P.y<0.5&&Math.abs(P.x-pd.x)<1.7&&Math.abs(P.z-pd.z)<1.7&&P.vy<=0.1){ P.vy=pd.p; P.ground=false; P.jumps=1; sfx.boing(); burst(pd.x,0.6,pd.z,'#ff3ea5',10,5); } }
    // coins
    for(const c of S.coins){ if(c.taken) continue; c.m.rotation.y=t*3;
      if(c.mag>0){ c.mag-=dt; const dx=P.x-c.x, dy=P.y+1.2-c.y, dz=P.z-c.z, L=Math.hypot(dx,dy,dz)||1; c.x+=dx/L*16*dt; c.y+=dy/L*16*dt; c.z+=dz/L*16*dt; }
      c.m.position.set(c.x,c.y+Math.sin(t*3+c.x)*0.15,c.z);
      if(Math.hypot(c.x-P.x,c.y-(P.y+1.2*V.size),c.z-P.z)<1.4+0.5*V.size){ c.taken=true; c.m.visible=false; S.got++; sfx.coin(); burst(c.x,c.y,c.z,'#ffd21f',8,5); S.hud();
        if(S.got===S.coins.length&&!S.done){ S.done=true; banner('ALL COINS!',2200); sfx.win(); confetti(P.x,P.y+3,P.z); } } }
    // crown
    S.trophy.rotation.y=t*2; S.trophy.position.y=9.4+Math.sin(t*2)*0.2;
    if(!S.trophyTaken&&Math.hypot(P.x-24,P.z-16)<2&&P.y>7){ S.trophyTaken=true; hasCrown=true; S.trophy.visible=false; hero.crown.visible=true;
      banner('KING GOOSE!',2400); sfx.win(); confetti(P.x,P.y+3,P.z); S.hud(); }
    // goslings
    let lead={x:P.x,y:P.y,z:P.z};
    for(const o of S.gos){ let mv=0;
      if(o.follow){ const dx=lead.x-o.x, dz=lead.z-o.z, L=Math.hypot(dx,dz);
        if(L>1.5){ const s=Math.min(V.speed*1.7,(L-1.2)*5); o.x+=dx/L*s*dt; o.z+=dz/L*s*dt; o.h=Math.atan2(dx,dz); mv=1; }
        const gy2=S.groundAt(o.x,o.z,lead.y+0.6,0.2); o.y+=(gy2-o.y)*Math.min(1,dt*10); lead={x:o.x,y:o.y,z:o.z};
      } else { o.wt-=dt; if(o.wt<0){ o.wt=rand(1.5,4); o.h=rand(0,TAU); } if(o.wt>1){ o.x+=Math.sin(o.h)*1.2*dt; o.z+=Math.cos(o.h)*1.2*dt; mv=0.6; } }
      o.G.root.position.set(o.x,o.y,o.z); o.G.root.rotation.y=o.h; animGoose(o.G,t+o.x,mv,false);
    }
    // hero
    hero.root.position.set(P.x,P.y,P.z); hero.root.rotation.y=P.h; hero.root.scale.setScalar(V.size);
    animGoose(hero,t,clamp(Math.hypot(P.vx,P.vz)/V.speed,0,1.4),!P.ground);
    focus.set(P.x,P.y,P.z);
    const d=(7+3*V.size)*(camera.aspect<1?1.25:1);
    setCam(P.x-fx*d*Math.cos(camTilt*0.6),P.y+1.5+d*Math.sin(camTilt*0.9),P.z-fz*d*Math.cos(camTilt*0.6),P.x,P.y+1.9*V.size,P.z,dt,8);
  }
};

      R.x+=R.vx*dt; R.z+=R.vz*dt;
      // bump
      { const dx=P.x-R.x, dz=P.z-R.z, L=Math.hypot(dx,dz); if(L<1.5&&L>0.001){ const p=(1.5-L)/2; P.x+=dx/L*p; P.z+=dz/L*p; R.x-=dx/L*p; R.z-=dz/L*p; } }
      [P,R].forEach(e=>{ if(Math.abs(e.x)>RX-0.8){ e.x=Math.sign(e.x)*(RX-0.8); e.vx=0; } if(Math.abs(e.z)>RZ-0.8){ e.z=Math.sign(e.z)*(RZ-0.8); e.vz=0; } });
      // ---- goalies
      const gmove=(gk,sp)=>{ gk.z+=clamp(K.z-gk.z,-sp*dt,sp*dt); gk.z=clamp(gk.z,-GW+0.5,GW-0.5); };
      gmove(S.g1,7.5); gmove(S.g2,4.6);
      // ---- puck
      const dP=Math.hypot(P.x-K.x,P.z-K.z), dR=Math.hypot(R.x-K.x,R.z-K.z);
      if(K.owner===null){
        K.x+=K.vx*dt; K.z+=K.vz*dt; const kd=Math.exp(-0.55*dt); K.vx*=kd; K.vz*=kd;
        if(Math.abs(K.z)>RZ-0.35){ K.z=Math.sign(K.z)*(RZ-0.35); K.vz*=-0.8; sfx.tick(); }
        [S.g1,S.g2].forEach(gk=>{ if(Math.abs(K.x-gk.x)<0.9&&Math.abs(K.z-gk.z)<1.05&&Math.sign(K.vx)===Math.sign(gk.x)&&Math.abs(K.vx)>1){ K.vx*=-0.65; K.vz+=rand(-7,7); K.x=gk.x-Math.sign(gk.x)*1.0; sfx.thud(); toast('SAVE!',700); } });
        if(Math.abs(K.x)>RX-0.35){ if(Math.abs(K.z)<GW-0.1) S.goal(K.x>0?0:1); else { K.x=Math.sign(K.x)*(RX-0.35); K.vx*=-0.8; sfx.tick(); } }
        if(S.pause<=0){ if(dP<1.35&&P.pick<=0){ K.owner='p'; S.holdT=0; } else if(dR<1.15&&R.pick<=0&&R.stun<=0){ K.owner='r'; R.hold=0; R.aimZ=rand(-5,5); } }
        if(inp.aP) P.swing=0.2;
      } else if(K.owner==='p'){
        S.holdT+=dt; const tx=clamp(P.x+Math.sin(P.h)*1.25,-RX+0.6,RX-0.6), tz=clamp(P.z+Math.cos(P.h)*1.25,-RZ+0.6,RZ-0.6), k=Math.min(1,dt*22); K.x+=(tx-K.x)*k; K.z+=(tz-K.z)*k;
        if(inp.aP){ let fx=Math.sin(P.h), fz=Math.cos(P.h);
          if(fx>0.3){ const zc=K.z+(RX-K.x)*fz/fx; if(Math.abs(zc)<GW+3.5){ const az=clamp(zc,-GW+0.6,GW-0.6), dx=RX-K.x, dz=az-K.z, L=Math.hypot(dx,dz)||1; fx=dx/L; fz=dz/L; } }
          K.owner=null; K.vx=fx*V.puck; K.vz=fz*V.puck; P.pick=0.35; P.swing=0.25; sfx.shot(); burst(K.x,0.3,K.z,'#ffffff',6,3); }
        else if(dR<1.05&&S.holdT>1.0&&R.stun<=0){ K.owner='r'; R.hold=0; R.aimZ=rand(-5,5); P.pick=0.8; toast('Stolen! Go get it back!',900); }
      } else {
        const tx=R.x+Math.sin(R.h)*1.2, tz=R.z+Math.cos(R.h)*1.2, k=Math.min(1,dt*22); K.x+=(tx-K.x)*k; K.z+=(tz-K.z)*k;
        if(dP<1.3&&R.hold>0.45){ K.owner='p'; S.holdT=0; R.pick=0.9; toast('Nice steal!',800); sfx.tick(); }
        if(inp.aP) P.swing=0.2;
      }
    }
    // ---- draw
    hero.root.position.set(P.x,0,P.z); hero.root.rotation.y=P.h; hero.root.scale.setScalar(V.size);
    const pmv=clamp(Math.hypot(P.vx,P.vz)/(V.speed*1.3),0,1); animGoose(hero,t*0.6,pmv,false); hero.model.rotation.x=0.22*pmv; hero.stick.rotation.y=P.swing>0?-1.2*Math.sin(P.swing/0.25*Math.PI):0;
    S.rg.root.position.set(R.x,0,R.z); S.rg.root.rotation.y=R.h; animGoose(S.rg,t*0.6+1,clamp(Math.hypot(R.vx,R.vz)/7,0,1),R.stun>0);
    S.gp.root.position.set(S.g1.x,0,S.g1.z); S.gp.root.rotation.y=Math.PI/2; animGoose(S.gp,t,0.2,false);
    S.gr.root.position.set(S.g2.x,0,S.g2.z); S.gr.root.rotation.y=-Math.PI/2; animGoose(S.gr,t+2,0.2,false);
    S.puck.position.set(K.x,0.1,K.z);
    S.cheer-=dt; const ch=S.cheer>0?1:0.12;
    for(const f of S.fans){ const y=Math.abs(Math.sin(t*(S.cheer>0?11:2.5)+f.ph))*0.7*ch; f.a.position.y=f.y+0.45+y; f.b.position.y=f.y+1.15+y; }
    focus.set(P.x,0,P.z);
    const port=camera.aspect<1, fxm=P.x*0.75+K.x*0.25, fzm=P.z*0.75+K.z*0.25;
    const tf=port?78:58; if(camera.fov!==tf){ camera.fov=tf; camera.updateProjectionMatrix(); }
    setCam(fxm-(port?16:15),port?15:12.5,fzm*0.75,fxm+4,0,fzm*0.9,dt,5);
  }
};

/* =====================  MENU  ===================== */
const menu={
  init(){
    const g=world, rng=seeded(11);
    scene.background.set('#4aa8ff'); scene.fog.color.set('#4aa8ff'); scene.fog.near=60; scene.fog.far=220;
    box(60,1,60,'#4fbf4a',0,-0.5,0,g,false); patches(g,rng,50,56,['#46b043','#5acb52','#62d35a'],0.02);
    box(5,0.6,5,'#14161c',0,0.3,0,g); box(5.2,0.14,5.2,GLOW,0,0.62,0,g,false); box(3.6,0.5,3.6,'#1b2340',0,0.85,0,g);
    for(let i=0;i<16;i++){ const a=i/16*TAU+rng(), r=12+rng()*14; tree(g,Math.cos(a)*r,Math.sin(a)*r,0.8+rng()*0.8); }
    sky(g,rng); island(g,-34,14,-30,1.1); island(g,40,20,-44,1.3); island(g,10,26,60,1.2);
    heroReset(); hero.root.position.y=1.1;
  },
  update(dt,t){
    hero.root.scale.setScalar(V.size); hero.root.rotation.y=Math.sin(t*0.6)*0.5+0.4;
    animGoose(hero,t,0,false); hero.wings[1].rotation.z=1.9+Math.sin(t*7)*0.35; hero.model.position.y=Math.abs(Math.sin(t*2.4))*0.12;
    focus.set(0,0,0);
    const a=t*0.25+0.5, port=camera.aspect<1, d=port?10.5:8.5;
    const tf=60; if(camera.fov!==tf){ camera.fov=tf; camera.updateProjectionMatrix(); }
    setCam(Math.sin(a)*d,3.2,Math.cos(a)*d,0,port?1.6:2.4,0,dt,4);
  },
  onHonk(){ confetti(0,4,0); }
};

/* =====================  GAME STATE  ===================== */
const scenarios={park,bike,hockey};
let state='menu', cur=menu, time=0, honkCD=0;
function clearWorld(){
  if(cur&&cur.cleanup) cur.cleanup();
  scene.remove(world); world=new T.Group(); scene.add(world);
  parts.forEach(m=>scene.remove(m)); parts.length=0;
  rings.forEach(m=>scene.remove(m)); rings.length=0;
  camera.fov=60; camera.updateProjectionMatrix(); camSnap=true; hero.head.rotation.set(0,0,0);
}
function start(name){
  initAudio(); if(document.activeElement) document.activeElement.blur();
  clearWorld(); cur=scenarios[name]; state='play'; cur.init();
  $('menu').classList.add('hidden'); $('hud').classList.remove('hidden');
  $('btnA').textContent=cur.btnA; $('btnB').textContent=cur.btnB;
  if(isTouch){ $('touch').classList.remove('hidden'); } else { $('hint').innerHTML=cur.hint; $('hint').classList.remove('hidden'); }
}
function toMenu(){
  clearWorld(); cur=menu; state='menu'; menu.init();
  $('menu').classList.remove('hidden'); $('hud').classList.add('hidden'); $('touch').classList.add('hidden'); $('hint').classList.add('hidden'); $('lab').classList.add('hidden');
  $('banner').classList.remove('on');
}
document.querySelectorAll('.card').forEach(b=>b.addEventListener('click',()=>start(b.dataset.s)));
$('bMenu').addEventListener('click',toMenu);
$('bLab').addEventListener('click',()=>$('lab').classList.toggle('hidden'));
$('bSnd').addEventListener('click',()=>{ muted=!muted; $('bSnd').style.opacity=muted?0.4:1; if(master) master.gain.value=muted?0:0.5; });

function honk(){
  if(honkCD>0) return; honkCD=0.45; sfx.honk(); hero.honkT=0.35;
  hero.root.getWorldPosition(tmpV); ring(tmpV.x,tmpV.y+0.3,tmpV.z); showBubble();
  if(cur&&cur.onHonk) cur.onHonk();
}

/* =====================  CODE LAB  ===================== */
const labEls={};
function buildLab(){
  const rows=$('rows');
  LAB.forEach(L=>{ const d=document.createElement('div'); d.className='row';
    d.innerHTML='<div class="code"><span class="k">let</span> '+L[1]+' = <span class="n"></span>; <span class="c">// '+L[5]+'</span></div><input type="range" min="'+L[2]+'" max="'+L[3]+'" step="'+L[4]+'">';
    const n=d.querySelector('.n'), r=d.querySelector('input'); labEls[L[0]]={n,r};
    r.addEventListener('input',()=>{ V[L[0]]=parseFloat(r.value); n.textContent=r.value; });
    rows.appendChild(d); });
  ['#19d3ff','#ff3ea5','#7CFC6B','#ffb020','#c77dff','#ff3355'].forEach(c=>{ const b=document.createElement('button'); b.style.background=c; b.addEventListener('click',()=>setGlow(c)); $('swatches').appendChild(b); });
  document.querySelectorAll('#presets button').forEach(b=>b.addEventListener('click',()=>{
    const p=b.dataset.p;
    if(p==='moon'){ V.gravity=6; }
    if(p==='giant'){ V.size=2.6; }
    if(p==='tiny'){ V.size=0.45; }
    if(p==='turbo'){ V.speed=18; V.bikePower=75; V.puck=48; }
    if(p==='reset'){ Object.assign(V,DEFAULTS); setGlow(DEFAULTS.glow); }
    syncLab(); }));
  syncLab();
}
function syncLab(){ LAB.forEach(L=>{ labEls[L[0]].r.value=V[L[0]]; labEls[L[0]].n.textContent=V[L[0]]; }); }
function setGlow(c){ V.glow=c; glowMat.color.set(c); document.documentElement.style.setProperty('--glow',c); $('glowVal').textContent='"'+c+'"'; }
buildLab();

/* =====================  MAIN LOOP  ===================== */
const clock=new T.Clock();
function frame(){
  requestAnimationFrame(frame);
  const dt=Math.min(clock.getDelta(),0.05); time+=dt;
  readInput(); honkCD-=dt;
  if(inp.honkP) honk();
  cur.update(dt,time);
  if(hero.honkT>0){ hero.honkT-=dt; const k=Math.sin(Math.PI*(1-Math.max(0,hero.honkT)/0.35)); hero.head.rotation.x=-0.6*k; hero.head.scale.setScalar(1+0.3*k); }
  else { hero.head.rotation.x=0; hero.head.scale.setScalar(1); }
  updateParts(dt); updateRings(dt);
  sun.position.set(focus.x+22,focus.y+44,focus.z+12); sun.target.position.copy(focus);
  if(toastT>0){ toastT-=dt; if(toastT<=0) $('toast').style.opacity=0; }
  if(bannerT>0){ bannerT-=dt; if(bannerT<=0) $('banner').classList.remove('on'); }
  if(bubbleT>0){ bubbleT-=dt; if(bubbleT<=0) $('bubble').style.opacity=0; }
  renderer.render(scene,camera);
  inp.aP=inp.bP=inp.honkP=false;
}
menu.init();
// small test hook: lets a parent (or a test script) jump straight into a world
window.GOOSE={start,toMenu,V,inp,keys,get cur(){return cur;}};
frame();
})();
</script>
